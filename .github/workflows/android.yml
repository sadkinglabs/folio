name: Android checks
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, unit, SFTP, lint, APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The default list includes the removed 'tools' package, which fails on current cmdline-tools.
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore preserved debug signing key
        # Without it CI APKs get a random key and cannot install over an existing Folio.
        env:
          KEYSTORE_B64: ${{ secrets.FOLIO_DEBUG_KEYSTORE_B64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          mkdir -p development-signing
          echo "$KEYSTORE_B64" | base64 -d > development-signing/debug.keystore
      - run: python3 -m pip install paramiko==5.0.0 lupa==2.8 graphql-core==3.2.7
      # Runs checkFormatting, core/transport/app unit tests (with real localhost SFTP),
      # assembleDebug, assembleDebugAndroidTest and lint.
      - run: python3 scripts/check-with-sftp.py
      - run: python3 scripts/check-migration.py
      - run: python3 scripts/check-library-basics.py
      - run: python3 scripts/check-local-removal.py
      - run: python3 scripts/check-plugin.py
      - name: Reader position interop (DOM fixtures)
        run: npm ci --prefix tools/reader-interop && npm test --prefix tools/reader-interop
      - name: Hardcover queries match the published schema
        run: python3 scripts/check-hardcover-schema.py
      - uses: actions/upload-artifact@v4
        with:
          name: folio-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'

  instrumented:
    name: Instrumentation tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # publishes screenshots to a ci-screenshots/<branch> branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The default list includes the removed 'tools' package, which fails on current cmdline-tools.
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # connectedDebugAndroidTest uninstalls the app afterwards, losing its screenshots, so
          # the screenshot tests run once more on a kept install and the images are copied out.
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest || touch instrumentation-failed
            ./gradlew --no-daemon :app:installDebug :app:installDebugAndroidTest
            adb shell am instrument -w -e class dev.sadking.folio.ReaderUiTest,dev.sadking.folio.ProductJourneyTest dev.sadking.folio.test/androidx.test.runner.AndroidJUnitRunner || true
            mkdir -p screenshots && (adb exec-out run-as dev.sadking.folio tar c files/qa | tar x -C screenshots) || true
            test ! -f instrumentation-failed
      - name: Print failed instrumentation tests
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True):
              root = ET.parse(path).getroot()
              print(f"{path}: tests={root.get('tests')} failures={root.get('failures')} errors={root.get('errors')} skipped={root.get('skipped')}")
              for case in root.iter('testcase'):
                  for kind in ('failure', 'error'):
                      node = case.find(kind)
                      if node is not None:
                          print(f"\n=== {kind.upper()}: {case.get('classname')}.{case.get('name')}")
                          print((node.text or node.get('message') or '')[:12000])
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumentation-reports
          path: app/build/reports/androidTests/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/files/qa/
      - name: Publish screenshots to ci-screenshots/<branch>
        if: always() && github.event_name == 'push'
        env:
          TOKEN: ${{ github.token }}
        run: |
          [ -d screenshots/files/qa ] || exit 0
          cd screenshots/files/qa
          git init -q -b screenshots && git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Screenshots for ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" "screenshots:ci-screenshots/${GITHUB_REF_NAME}"
