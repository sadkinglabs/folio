name: Android checks
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 -m pip install paramiko==5.0.0 lupa==2.8
      - run: ./gradlew checkFormatting
      - run: python3 scripts/check-with-sftp.py
      - run: python3 scripts/check-migration.py
      - run: python3 scripts/check-plugin.py
      - uses: actions/upload-artifact@v4
        with:
          name: folio-debug
          path: app/build/outputs/apk/debug/app-debug.apk
